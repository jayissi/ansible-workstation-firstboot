---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args:
          - --fix=lf

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args:
          - -c
          - lint/.yamllint.yml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        # --toml (not --config): --config parses the file as INI, which
        # breaks on multi-line TOML arrays. CI reads [tool.codespell] the
        # same way via tomllib.
        args:
          - --toml
          - pyproject.toml

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^(roles/common/files/(bin|bashrc\.d)/|tests/.*\.sh$|lint/.*\.sh$)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        args:
          - --config
          - lint/.gitleaks.toml

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - lint/.secrets.baseline
        # Never scan the baseline itself: its hashed_secret values look
        # like new secrets, so every run appended self-referencing entries
        # and rewrote the file, aborting the commit in a loop.
        exclude: ^lint/\.secrets\.baseline$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
        args:
          - --config
          - lint/.markdownlint-cli2.yaml

  - repo: local
    hooks:
      # Upstream "hadolint-docker" needs the docker CLI (absent on
      # podman-only Fedora hosts) and ignored lint/.hadolint.yaml. Same
      # command and Fedora package as CI (dnf install hadolint), like the
      # shfmt/selint hooks below.
      - id: hadolint
        name: hadolint (Containerfile lint)
        entry: hadolint --config lint/.hadolint.yaml
        language: system
        types:
          - dockerfile
      - id: shfmt
        name: shfmt (format check)
        entry: shfmt -d
        language: system
        files: ^(roles/common/files/(bin|bashrc\.d)/|tests/.*\.sh$|lint/.*\.sh$)
      - id: selint
        name: selint (SELinux policy lint)
        entry: selint
        language: system
        files: ^roles/.*/files/selinux/.*\.(te|if|fc)$
      - id: markdown-table-formatter
        name: markdown-table-formatter (table alignment check)
        language: node
        entry: markdown-table-formatter --check
        additional_dependencies:
          - markdown-table-formatter@1.7.0
        types:
          - markdown
        require_serial: true
