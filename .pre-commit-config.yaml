---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, lint/.yamllint.yml]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [--config, pyproject.toml]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^roles/common/files/(bin|bashrc\.d)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', 'lint/.secrets.baseline']

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
        args: [--config, lint/.markdownlint-cli2.yaml]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      - id: shfmt
        name: shfmt (format check)
        entry: shfmt -d
        language: system
        files: ^roles/common/files/(bin|bashrc\.d)/
      - id: selint
        name: selint (SELinux policy lint)
        entry: selint
        language: system
        files: ^roles/.*/files/selinux/.*\.(te|if|fc)$
      - id: markdown-table-formatter
        name: markdown-table-formatter (table alignment check)
        language: node
        entry: markdown-table-formatter --check
        additional_dependencies: ["markdown-table-formatter@1.7.0"]
        types: [markdown]
        require_serial: true
