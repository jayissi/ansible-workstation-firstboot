---
- name: Restart sssd
  ansible.builtin.systemd_service:
    name: sssd.service
    state: restarted

- name: Compile and install auth SELinux policies
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      cd {{ auth_selinux_dir }}
      for te_file in *.te; do
        mod_name="${te_file%.te}"
        rm -f "${mod_name}.pp" "tmp/${mod_name}.mod" "tmp/${mod_name}.mod.fc" 2>/dev/null || true
        make -f /usr/share/selinux/devel/Makefile "${mod_name}.pp"
        semodule -i "${mod_name}.pp"
      done
  changed_when: true
