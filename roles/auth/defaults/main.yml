---
# ---------------------------------------------------------------------------
# Auth / PAM hardening (CIS RHEL 9 v3.0.0)
# ---------------------------------------------------------------------------

# authselect profile and features
auth_profile: sssd
auth_features:
  - with-tlog
  - with-faillock
  - with-pamaccess
  - with-pwhistory
  - without-nullok

# ---------------------------------------------------------------------------
# faillock -- CIS 5.3.3.1.x (account lockout after failed attempts)
# ---------------------------------------------------------------------------
auth_faillock_deny: 3
auth_faillock_unlock_time: 900
auth_faillock_fail_interval: 900
auth_faillock_even_deny_root: true
auth_faillock_root_unlock_time: 60
auth_faillock_dir: /var/log/faillock

# ---------------------------------------------------------------------------
# pwquality -- CIS 5.3.3.2.x (password complexity)
# ---------------------------------------------------------------------------
auth_pwquality_minlen: 14
auth_pwquality_minclass: 4
auth_pwquality_maxrepeat: 3
auth_pwquality_maxsequence: 3
auth_pwquality_dictcheck: 1
auth_pwquality_retry: 3

# ---------------------------------------------------------------------------
# pwhistory -- CIS 5.3.3.3.1 (password reuse)
# ---------------------------------------------------------------------------
auth_pwhistory_remember: 24
auth_pwhistory_enforce_for_root: true

# ---------------------------------------------------------------------------
# su restricted to the wheel group -- CIS 5.2.7 (pam_wheel in /etc/pam.d/su)
# ---------------------------------------------------------------------------
auth_su_wheel_only: true

# ---------------------------------------------------------------------------
# pam_access (/etc/security/access.conf). authselect's with-pamaccess puts
# pam_access in the account stack of system-auth/password-auth, so these
# rules gate SSH, sudo, su, GDM and cron. First match wins; the final rule
# denies everyone else. "LOCAL" matches any origin without a dot (ttys,
# ":0", cron, and sudo without a tty -- which is how Ansible runs).
# ---------------------------------------------------------------------------
auth_access_conf_enabled: true
auth_access_rules:
  - "+:root:LOCAL"
  - "+:gdm:LOCAL"
  - "+:{{ common_admin_user | default('root') }}:LOCAL {{ (ssh_allowed_sources | default([])) | map(attribute='ip') | join(' ') }}"
  - "+:ALL:cron crond"
  - "-:ALL:ALL"

# ---------------------------------------------------------------------------
# nsswitch.conf hosts line (post-authselect override)
# ---------------------------------------------------------------------------
# [NOTFOUND=continue] (KNOWN_ISSUES P21): an mDNS miss falls through to
# Unbound instead of ending resolution. The dns role writes the same line
# via this variable so the two roles no longer fight over nsswitch.conf.
auth_nsswitch_hosts: "files mdns_minimal [NOTFOUND=continue] myhostname dns"

# ---------------------------------------------------------------------------
# vault-ssh-helper (OTP validation via Vault SSH secrets engine)
# ---------------------------------------------------------------------------
auth_vault_ssh_helper_enabled: true
# vault-ssh-helper has no RPM package (confirmed: no Fedora/RHEL package
# exists upstream, see hashicorp/vault-ssh-helper#68, still open). Installed
# as a binary release from releases.hashicorp.com instead of via dnf.
auth_vault_ssh_helper_version: "0.2.4"
auth_vault_ssh_helper_checksum: "1fd74ccfe4de134dcc527771c9eaaa2f95756975c11baff136eecdbe56bd0e1d"
auth_vault_ssh_helper_addr: "https://127.0.0.1:8200"
auth_vault_ssh_helper_mount: "ssh-otp"
# Pinned to the Vault Root CA only (not the whole system bundle). It is a
# copy in /etc/vault-ssh-helper.d (etc_t) because sshd_session_t cannot read
# /etc/vault.d/certs (vault_conf_t, 0700).
auth_vault_ssh_helper_ca_source: /etc/vault.d/certs/root.crt
auth_vault_ssh_helper_ca_cert: /etc/vault-ssh-helper.d/vault-ca.pem
# Only the daily OTP role may be validated by this host (was "*").
auth_vault_ssh_helper_allowed_roles: "daily"

# ---------------------------------------------------------------------------
# FIDO2/U2F placeholder (future -- see backlog)
# ---------------------------------------------------------------------------
auth_pam_u2f_enabled: false

# ---------------------------------------------------------------------------
# SELinux policy compilation directory
# ---------------------------------------------------------------------------
auth_selinux_dir: /opt/auth-selinux
