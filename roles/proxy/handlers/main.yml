---
- name: Reload proxy systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart nginx
  ansible.builtin.systemd_service:
    name: '{{ __proxy_service_name }}'
    state: restarted

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: '{{ __proxy_service_name }}'
    state: reloaded
