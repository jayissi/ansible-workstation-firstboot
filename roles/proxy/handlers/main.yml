---
- name: Reload proxy systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart nginx
  ansible.builtin.systemd_service:
    name: '{{ __proxy_service_name }}'
    state: restarted

# `nginx -t` test-binds every listen socket. Run directly under become as
# the confined admin (staff_u -> sysadm_t), the bind is denied by SELinux
# ("bind() ... (13: Permission denied)") and every validation fails on
# hardened re-runs. systemd-run starts nginx from init, so it transitions
# into its normal httpd_t domain -- the same context the real service uses.
- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: systemd-run --quiet --wait --pipe --collect --service-type=exec /usr/sbin/nginx -t
  register: __proxy_nginx_config_test
  changed_when: false
  failed_when: false
  listen: Reload nginx

- name: Reload nginx (config validated)
  ansible.builtin.systemd_service:
    name: '{{ __proxy_service_name }}'
    state: reloaded
  when: __proxy_nginx_config_test.rc == 0
  listen: Reload nginx

- name: Fail if nginx config is invalid
  ansible.builtin.fail:
    msg: >-
      Nginx configuration test failed:
      {{ __proxy_nginx_config_test.stderr | default('unknown error') }}.
      Config NOT reloaded.
  when: __proxy_nginx_config_test.rc is defined and __proxy_nginx_config_test.rc != 0
  listen: Reload nginx
