---
# roles/verification/tasks/network.yml
# SSH hardening, DNS resolution, resolv.conf, nsswitch.conf checks

# ------------------------------------------------------------------
# SSH hardening
# ------------------------------------------------------------------
- name: Network | Check SSHD configuration
  ansible.builtin.command:
    cmd: sshd -T
  register: verification_sshd
  changed_when: false

- name: Network | Assert SSH hardening
  ansible.builtin.assert:
    that:
      - "'permitrootlogin no' in verification_sshd.stdout | lower"
      - "'passwordauthentication no' in verification_sshd.stdout | lower"
    quiet: true
    success_msg: "PASS: SSH hardened (no root, no password)"
    fail_msg: "FAIL: SSH hardening incomplete"

# ------------------------------------------------------------------
# DNS -- resolution test
# ------------------------------------------------------------------
- name: Network | Test DNS resolution via local resolver
  ansible.builtin.command:
    cmd: "dig @127.0.0.1 example.com +short +timeout=5"
  register: verification_dns_dig
  changed_when: false
  failed_when: false

- name: Network | Assert DNS resolution works
  ansible.builtin.assert:
    that: verification_dns_dig.rc == 0
    quiet: true
    success_msg: "PASS: DNS resolution via 127.0.0.1 works"
    fail_msg: "FAIL: DNS resolution via 127.0.0.1 failed"

# ------------------------------------------------------------------
# DNS -- resolv.conf points to local resolver
# ------------------------------------------------------------------
- name: Network | Read resolv.conf
  ansible.builtin.slurp:
    src: /etc/resolv.conf
  register: verification_resolv_conf

- name: Network | Assert resolv.conf contains local nameserver
  ansible.builtin.assert:
    that: "'nameserver 127.0.0.1' in (verification_resolv_conf.content | b64decode)"
    quiet: true
    success_msg: "PASS: resolv.conf points to 127.0.0.1"
    fail_msg: "FAIL: resolv.conf does not contain nameserver 127.0.0.1"

# ------------------------------------------------------------------
# DNS -- nsswitch.conf hosts line (no nss-resolve)
# ------------------------------------------------------------------
- name: Network | Read nsswitch.conf
  ansible.builtin.slurp:
    src: /etc/nsswitch.conf
  register: verification_nsswitch

- name: Network | Assert nsswitch.conf has correct hosts line without nss-resolve
  ansible.builtin.assert:
    that:
      - "'resolve' not in (verification_nsswitch.content | b64decode | regex_search('(?m)^hosts:.*$') | default(''))"
    quiet: true
    success_msg: "PASS: nsswitch.conf hosts line does not use nss-resolve"
    fail_msg: "FAIL: nsswitch.conf hosts line still references nss-resolve"
