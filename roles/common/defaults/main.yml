---
common_admin_user: jayissi
common_admin_home: "/home/{{ common_admin_user }}"

common_packages: []
common_rpm_gpg_keys: []
common_third_party_repos: []
common_bin_utilities: []
common_bashrc_files: []
common_umask_value: "0027"
common_luks_root_device: ""

# Swap disable (physical hosts only -- Vault hardening)
common_disable_swap: true

common_sshd_banner: ""

# System default target (graphical.target for GUI workstations)
common_default_target: graphical.target

# ---------------------------------------------------------------------------
# Session controls (tasks/session.yml)
# ---------------------------------------------------------------------------
# Idle interactive shell timeout in seconds (CIS 5.6.4). 0 disables it.
common_shell_timeout: 3600
# Users allowed to use cron/at (CIS 5.1.8-9); all others are refused.
common_cron_allow_users:
  - root
  - "{{ common_admin_user }}"
# GNOME: lock the screen after this many idle seconds (CIS 1.8.x) ...
common_screen_idle_delay: 900
# ... and require the password immediately (seconds of grace after blanking).
common_screen_lock_delay: 0
# GDM login banner; text comes from common_sshd_banner when it is set.
common_gdm_banner_enabled: true
common_gdm_banner_default: "Authorized users only. Activity may be monitored and recorded."
