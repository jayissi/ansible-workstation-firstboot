---
# roles/dns/tasks/main.yml
# Unbound local caching resolver with DNSSEC + DNS-over-TLS

- name: Load OS-specific variables
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_facts["distribution"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["os_family"] }}-{{ ansible_facts["distribution_major_version"] }}.yml'
        - '{{ ansible_facts["distribution"] }}.yml'
        - '{{ ansible_facts["os_family"] }}.yml'
      paths:
        - 'vars'
  tags:
    - always

- name: Import install tasks
  ansible.builtin.import_tasks: install.yml
  tags:
    - dns
    - dns:install

- name: Import configure tasks
  ansible.builtin.import_tasks: configure.yml
  tags:
    - dns
    - dns:configure

- name: Import blocklist tasks
  ansible.builtin.import_tasks: blocklist.yml
  when: dns_blocklist_enabled | bool and not (dns_rpz_enabled | default(false) | bool)
  tags:
    - dns
    - dns:blocklist

- name: Import service tasks
  ansible.builtin.import_tasks: service.yml
  tags:
    - dns
    - dns:service
