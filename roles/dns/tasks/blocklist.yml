---
# DNS blocklist: deploy update script, run initial download

- name: Blocklist | Deploy update script
  ansible.builtin.template:
    src: update-blocklist.sh.j2
    dest: '/usr/local/bin/unbound-update-blocklist'
    owner: root
    group: root
    mode: '0755'

# Run when the list is missing OR empty: an earlier failed download leaves a
# header-only file, and `creates:` would then skip the update forever.
- name: Blocklist | Count current blocklist entries
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      grep -c '^local-zone' /etc/unbound/conf.d/50-blocklist.conf 2>/dev/null || echo 0
  register: __dns_blocklist_count
  changed_when: false

- name: Blocklist | Run initial update
  ansible.builtin.command:
    cmd: '/usr/local/bin/unbound-update-blocklist'
  when: __dns_blocklist_count.stdout | int == 0
  changed_when: true
  notify: Reload unbound
