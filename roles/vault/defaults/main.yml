---
vault_version: latest
vault_addr: "https://127.0.0.1:8200"
vault_api_addr: "https://127.0.0.1:8200"
vault_cluster_addr: "https://127.0.0.1:8201"
vault_raft_node_id: "node1"
vault_local_hostname: vault.local
vault_ui: true
vault_disable_mlock: false
vault_log_level: info

vault_user: vault
vault_group: vault

vault_config_dir: /etc/vault.d
vault_data_dir: /opt/vault/data
vault_log_dir: /var/log/vault
vault_cert_dir: /etc/vault.d/certs
vault_run_dir: /opt/vault/run
vault_agent_run_dir: /opt/vault/agent-run
vault_selinux_dir: /opt/vault/selinux

vault_tls_cert_file: "{{ vault_cert_dir }}/server-chain.crt"
vault_tls_key_file: "{{ vault_cert_dir }}/server.key"

# Nginx proxy cert directory (separate leaf cert, vault.local SAN only)
vault_proxy_cert_dir: /etc/nginx/certs

vault_key_shares: 5
vault_key_threshold: 3

# PKI key type: "ec" (ECDSA P-256, browser-compatible) or "ed25519" (future)
vault_pki_key_type: ec
vault_pki_key_bits: 256

# Certificate subject fields
vault_pki_organization: "Local Example Corp"
vault_pki_ou: "IT Department"
vault_pki_locality: "Washington"
vault_pki_province: "District of Columbia"
vault_pki_country: "US"

vault_pki_root_ttl: "87600h"
vault_pki_intermediate_ttl: "8760h"
vault_pki_leaf_ttl: "2160h"
vault_pki_leaf_max_ttl: "2160h"
vault_agent_renew_threshold: "0.9"

vault_unseal_keys_file: /root/vault-unseal-keys.age
vault_age_identity_file: /root/.vault-unseal-identity.txt
vault_age_recipients_file: /root/.vault-unseal-recipients.txt
vault_use_tpm2: true

vault_grub_kv_path: "secret/data/grub"
vault_grub_kv_key: "password_hash"

# SSH secrets engine
vault_ssh_enabled: true
vault_ssh_otp_cidr_list: "192.168.122.0/24,127.0.0.1/32"
vault_ssh_ca_key_type: ed25519
vault_ssh_ca_ttl: "24h"
vault_ssh_ca_max_ttl: "72h"
