---
# roles/vault/tasks/_daily_token.yml
# Keep ONE periodic daily-use token per purpose (KNOWN_ISSUES #53).
# Included per entry of vault_daily_tokens (loop_var: _vault_tok).
#
# Before: every deploy created a new admin-daily / monitoring-readonly token
# (ttl 0 -> 32-day max), stored it in KV and never revoked the previous one,
# so dozens of valid vault-admin-full tokens accumulated. Now the stored
# token is looked up and renewed while valid; a replacement is created only
# when it is missing/invalid/mis-scoped, and the old one is revoked.
# Periodic tokens have no max TTL: each renewal resets the full period.

- name: Daily Token | Read stored token - {{ _vault_tok.name }}
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/tokens/{{ _vault_tok.name }}"
    method: GET
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 404
  register: _vault_tok_kv
  no_log: true

- name: Daily Token | Look up stored token - {{ _vault_tok.name }}
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/token/lookup"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      token: "{{ _vault_tok_kv.json.data.data.token | default('') }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 400
      - 403
  register: _vault_tok_lookup
  when: _vault_tok_kv.status == 200
  no_log: true

- name: Daily Token | Decide whether the stored token is reusable - {{ _vault_tok.name }}
  ansible.builtin.set_fact:
    _vault_tok_valid: >-
      {{ _vault_tok_kv.status == 200
         and (_vault_tok_lookup.status | default(0)) == 200
         and _vault_tok.policy in (_vault_tok_lookup.json.data.policies | default([]))
         and (_vault_tok_lookup.json.data.period | default(0) | int) > 0 }}

- name: Daily Token | Renew the stored token - {{ _vault_tok.name }}
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/token/renew"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      token: "{{ _vault_tok_kv.json.data.data.token }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
  when: _vault_tok_valid | bool
  changed_when: false
  no_log: true

- name: Daily Token | Create replacement token - {{ _vault_tok.name }}
  when: not (_vault_tok_valid | bool)
  block:
    - name: Daily Token | Create periodic token - {{ _vault_tok.name }}
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/token/create"
        method: POST
        headers:
          X-Vault-Token: "{{ _vault_token }}"
        body_format: json
        body:
          policies:
            - "{{ _vault_tok.policy }}"
          display_name: "{{ _vault_tok.display_name }}"
          period: "{{ vault_daily_token_period }}"
          no_parent: true
          renewable: true
        ca_path: "{{ _vault_ca_path }}"
        status_code:
          - 200
      register: _vault_tok_new
      changed_when: true
      no_log: true

    - name: Daily Token | Store the token in KV - {{ _vault_tok.name }}
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/secret/data/tokens/{{ _vault_tok.name }}"
        method: POST
        headers:
          X-Vault-Token: "{{ _vault_token }}"
        body_format: json
        body:
          data:
            token: "{{ _vault_tok_new.json.auth.client_token }}"
            accessor: "{{ _vault_tok_new.json.auth.accessor }}"
            policies: "{{ _vault_tok.policy }}"
        ca_path: "{{ _vault_ca_path }}"
        status_code:
          - 200
          - 204
      changed_when: true
      no_log: true

    - name: Daily Token | Revoke the superseded token - {{ _vault_tok.name }}
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/token/revoke-accessor"
        method: POST
        headers:
          X-Vault-Token: "{{ _vault_token }}"
        body_format: json
        body:
          accessor: "{{ _vault_tok_lookup.json.data.accessor }}"
        ca_path: "{{ _vault_ca_path }}"
        status_code:
          - 204
          - 400
      when: (_vault_tok_lookup.status | default(0)) == 200
      changed_when: true
      no_log: true

- name: Daily Token | Remember the current accessor - {{ _vault_tok.name }}
  ansible.builtin.set_fact:
    _vault_daily_token_accessors: >-
      {{ (_vault_daily_token_accessors | default([]))
         + [(_vault_tok_lookup.json.data.accessor if (_vault_tok_valid | bool)
             else _vault_tok_new.json.auth.accessor)] }}
  no_log: true
