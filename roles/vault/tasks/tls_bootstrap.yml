---
# roles/vault/tasks/tls_bootstrap.yml
# Generate temporary self-signed TLS cert for Vault bootstrap.
# Supports ECDSA P-384 (default) or Ed25519 via vault_pki_key_type variable.

- name: Tls Bootstrap | Generate bootstrap private key
  community.crypto.openssl_privatekey:
    path: "{{ vault_tls_key_file }}"
    type: "{{ 'Ed25519' if vault_pki_key_type == 'ed25519' else 'ECC' }}"
    curve: "{{ omit if vault_pki_key_type == 'ed25519' else 'secp' ~ vault_pki_key_bits ~ 'r1' }}"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0400"

- name: Tls Bootstrap | Generate bootstrap CSR
  community.crypto.openssl_csr:
    path: "{{ vault_cert_dir }}/bootstrap.csr"
    privatekey_path: "{{ vault_tls_key_file }}"
    common_name: "vault-bootstrap"
    organization_name: "{{ vault_pki_organization }}"
    organizational_unit_name: "{{ vault_pki_ou }}"
    locality_name: "{{ vault_pki_locality }}"
    state_or_province_name: "{{ vault_pki_province }}"
    country_name: "{{ vault_pki_country }}"
    subject_alt_name:
      - "DNS:localhost"
      - "DNS:{{ vault_local_hostname }}"
      - "DNS:{{ ansible_hostname }}"
      - "DNS:{{ ansible_facts.fqdn }}"
      - "IP:127.0.0.1"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0640"

- name: Tls Bootstrap | Generate bootstrap self-signed certificate
  community.crypto.x509_certificate:
    path: "{{ vault_tls_cert_file }}"
    privatekey_path: "{{ vault_tls_key_file }}"
    csr_path: "{{ vault_cert_dir }}/bootstrap.csr"
    provider: selfsigned
    selfsigned_not_after: "+30d"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0444"

- name: Tls Bootstrap | Clean up bootstrap CSR
  ansible.builtin.file:
    path: "{{ vault_cert_dir }}/bootstrap.csr"
    state: absent
