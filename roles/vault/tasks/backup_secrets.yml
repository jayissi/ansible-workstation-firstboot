---
# roles/vault/tasks/backup_secrets.yml
# Store secrets in Vault KV as single source of truth backup

# ------------------------------------------------------------------
# TLS reference copies: PUBLIC material only (KNOWN_ISSUES #54)
# ------------------------------------------------------------------
#   secret/tls/ca     root_ca, intermediate_ca, ca_chain (intermediate+root)
#   secret/tls/vault  certificate, ca_chain   (Vault listener cert)
#   secret/tls/nginx  certificate, ca_chain   (vault.internal gateway cert)
# The PKI engine already publishes the CA certs (/v1/pki/ca/pem,
# /v1/pki_int/ca_chain); these copies are a convenience for distribution.
# No private keys: leaf certs are re-issued by Vault Agent, so a stored key
# is stale at best and a leak at worst. Written only when content changes.
- name: Backup Secrets | Read on-disk certificates for the TLS reference copies
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ vault_cert_dir }}/root.crt"
    - "{{ vault_cert_dir }}/intermediate.crt"
    - "{{ vault_cert_dir }}/server-chain.crt"
    - "{{ vault_proxy_cert_dir }}/server-chain.crt"
  register: _vault_tls_files
  failed_when: false

- name: Backup Secrets | Build the TLS reference copies
  vars:
    _pem_re: '-----BEGIN CERTIFICATE-----[\s\S]*?-----END CERTIFICATE-----'
    _files: >-
      {{ dict(_vault_tls_files.results | selectattr('content', 'defined')
         | map(attribute='item') | zip(_vault_tls_files.results | selectattr('content', 'defined')
         | map(attribute='content') | map('b64decode'))) }}
    _root: "{{ (_files[vault_cert_dir ~ '/root.crt'] | default('') | regex_findall(_pem_re) | first | default('')) }}"
    _int: "{{ (_files[vault_cert_dir ~ '/intermediate.crt'] | default('') | regex_findall(_pem_re) | first | default('')) }}"
    _vault_leaf: "{{ (_files[vault_cert_dir ~ '/server-chain.crt'] | default('') | regex_findall(_pem_re) | first | default('')) }}"
    _nginx_leaf: "{{ (_files[vault_proxy_cert_dir ~ '/server-chain.crt'] | default('') | regex_findall(_pem_re) | first | default('')) }}"
    _chain: "{{ _int ~ '\n' ~ _root ~ '\n' }}"
  ansible.builtin.set_fact:
    _vault_tls_copies: >-
      {{ ([{'path': 'ca', 'data': {'root_ca': _root ~ '\n', 'intermediate_ca': _int ~ '\n', 'ca_chain': _chain}}]
          if (_root and _int) else [])
         + ([{'path': 'vault', 'data': {'certificate': _vault_leaf ~ '\n', 'ca_chain': _chain}}]
            if (_vault_leaf and _root and _int) else [])
         + ([{'path': 'nginx', 'data': {'certificate': _nginx_leaf ~ '\n', 'ca_chain': _chain}}]
            if (_nginx_leaf and _root and _int) else []) }}

- name: Backup Secrets | Read current TLS reference copies
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/tls/{{ item.path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 404
  loop: "{{ _vault_tls_copies }}"
  loop_control:
    label: "tls/{{ item.path }}"
  register: _vault_tls_current

- name: Backup Secrets | Write changed TLS reference copies
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/tls/{{ item.item.path }}"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      data: "{{ item.item.data }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204
  loop: "{{ _vault_tls_current.results }}"
  loop_control:
    label: "tls/{{ item.item.path }}"
  when: item.status == 404 or (item.json.data.data | default({})) != item.item.data
  changed_when: true

# Pre-#54 layout: tls/root-ca (Root CA only) and tls/server (Vault leaf +
# intermediate + PRIVATE KEY, written once and stale since Agent rotation).
- name: Backup Secrets | Check legacy TLS copies
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/metadata/tls/{{ item }}"
    method: GET
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 404
  loop:
    - root-ca
    - server
  register: _vault_tls_legacy

- name: Backup Secrets | Remove legacy TLS copies (incl. the stale private key)
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/metadata/tls/{{ item.item }}"
    method: DELETE
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 204
  loop: "{{ _vault_tls_legacy.results }}"
  loop_control:
    label: "tls/{{ item.item }}"
  when: item.status == 200
  changed_when: true

- name: Backup Secrets | Back up AppRole role_id to Vault KV
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/approle/vault-agent"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      data:
        role_id: "{{ vault_approle_role_id_resp.json.data.role_id | default('') }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204
  no_log: true
  # vault_approle_role_id_resp.json (not just "is defined") -- the
  # "Configure AppRole auth" block in pki_engine.yml is skipped once
  # AppRole is already enabled, leaving this registered as a defined but
  # shapeless skipped-task dict.
  when: vault_approle_role_id_resp.json is defined

# Daily-use tokens (secret/tokens/admin, secret/tokens/readonly) are stored by
# _daily_token.yml, only when a token is replaced (KNOWN_ISSUES #53).
