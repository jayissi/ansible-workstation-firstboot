---
# roles/vault/tasks/backup_secrets.yml
# Store secrets in Vault KV as single source of truth backup

- name: Backup Secrets | Back up TLS cert chain and key to Vault KV
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/tls/server"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      data:
        certificate: "{{ vault_leaf_cert.json.data.certificate }}"
        issuing_ca: "{{ vault_leaf_cert.json.data.issuing_ca }}"
        private_key: "{{ vault_leaf_cert.json.data.private_key }}"
    validate_certs: false
    status_code:
      - 200
      - 204
  no_log: true
  # vault_leaf_cert.json (not just "is defined") -- register on a SKIPPED
  # task (idempotent reruns that didn't need a new cert) still produces a
  # defined dict, just without a .json key.
  when: vault_leaf_cert.json is defined

- name: Backup Secrets | Back up Root CA cert to Vault KV
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/tls/root-ca"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      data:
        certificate: "{{ vault_root_ca_pem.content }}"
    validate_certs: false
    status_code:
      - 200
      - 204
  when: vault_root_ca_pem.content is defined

- name: Backup Secrets | Back up AppRole role_id to Vault KV
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/approle/vault-agent"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      data:
        role_id: "{{ vault_approle_role_id_resp.json.data.role_id | default('') }}"
    validate_certs: false
    status_code:
      - 200
      - 204
  no_log: true
  # vault_approle_role_id_resp.json (not just "is defined") -- the
  # "Configure AppRole auth" block in pki_engine.yml is skipped once
  # AppRole is already enabled, leaving this registered as a defined but
  # shapeless skipped-task dict.
  when: vault_approle_role_id_resp.json is defined

- name: Backup Secrets | Back up admin token to Vault KV
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/tokens/admin"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      data:
        token: "{{ vault_admin_token_resp.json.auth.client_token }}"
        policies: "vault-admin-full"
    validate_certs: false
    status_code:
      - 200
      - 204
  no_log: true
  when: vault_admin_token_resp is defined

- name: Backup Secrets | Back up read-only token to Vault KV
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/tokens/readonly"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      data:
        token: "{{ vault_readonly_token_resp.json.auth.client_token }}"
        policies: "vault-admin-readonly"
    validate_certs: false
    status_code:
      - 200
      - 204
  no_log: true
  when: vault_readonly_token_resp is defined
