---
# roles/vault/tasks/pki_engine.yml
# Configure Vault PKI secrets engine with idempotent mount checks

- name: Pki Engine | Set Vault token for API calls
  ansible.builtin.set_fact:
    _vault_token: "{{ vault_root_token }}"
  no_log: true

# ------------------------------------------------------------------
# Audit devices (enable early so they capture everything after)
# ------------------------------------------------------------------
- name: Pki Engine | Check if Vault audit devices are enabled
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/audit"
    method: GET
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
  register: vault_audit_devices

- name: Pki Engine | Enable file audit device
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/audit/file"
    method: PUT
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      type: file
      options:
        file_path: "{{ vault_log_dir }}/audit.log"
        log_raw: "false"
        hmac_accessor: "true"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204
  when: "'file/' not in vault_audit_devices.json"

- name: Pki Engine | Enable syslog audit device
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/audit/syslog"
    method: PUT
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      type: syslog
      options:
        facility: "AUTH"
        tag: "vault-audit"
        log_raw: "false"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204
  when: "'syslog/' not in vault_audit_devices.json"

# ------------------------------------------------------------------
# Check existing mounts for idempotency
# ------------------------------------------------------------------
- name: Pki Engine | Get current Vault mounts
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/mounts"
    method: GET
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
  register: vault_mounts

# ------------------------------------------------------------------
# PKI Root CA
# ------------------------------------------------------------------
- name: Pki Engine | Enable PKI secrets engine (root)
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/mounts/pki"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      type: pki
      config:
        max_lease_ttl: "{{ vault_pki_root_ttl }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204
  when: "'pki/' not in vault_mounts.json"

- name: Pki Engine | Generate Root CA
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/pki/root/generate/internal"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      common_name: "{{ vault_pki_organization }} Root CA"
      issuer_name: "root-ca"
      key_type: "{{ vault_pki_key_type }}"
      # key_bits was missing here. Confirmed via runtime testing: without
      # it, Vault's generate/internal silently falls back to its own EC
      # default (P-256), NOT vault_pki_key_bits -- the Root CA was issued
      # at P-256 even with vault_pki_key_bits: 384 set, while the leaf-
      # issuing PKI roles below (which DO set key_bits) correctly got
      # P-384. Chain strength is bounded by its weakest link, so this
      # silently undermined the entire P-384/CNSA 2.0 upgrade at the
      # trust-anchor level.
      key_bits: "{{ vault_pki_key_bits }}"
      organization: "{{ vault_pki_organization }}"
      ou: "{{ vault_pki_ou }}"
      locality: "{{ vault_pki_locality }}"
      province: "{{ vault_pki_province }}"
      country: "{{ vault_pki_country }}"
      ttl: "{{ vault_pki_root_ttl }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
  when: "'pki/' not in vault_mounts.json"

# ------------------------------------------------------------------
# PKI Intermediate CA
# ------------------------------------------------------------------
- name: Pki Engine | Enable PKI secrets engine (intermediate)
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/mounts/pki_int"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      type: pki
      config:
        max_lease_ttl: "{{ vault_pki_intermediate_ttl }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204
  when: "'pki_int/' not in vault_mounts.json"

- name: Pki Engine | Generate Intermediate CSR
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/pki_int/intermediate/generate/internal"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      common_name: "{{ vault_pki_organization }} Intermediate CA"
      issuer_name: "intermediate-ca"
      key_type: "{{ vault_pki_key_type }}"
      # Same missing-key_bits bug as the Root CA above -- see comment
      # there. Confirmed via runtime testing: this CSR was also
      # generated at P-256 despite vault_pki_key_bits: 384.
      key_bits: "{{ vault_pki_key_bits }}"
      organization: "{{ vault_pki_organization }}"
      ou: "{{ vault_pki_ou }}"
      locality: "{{ vault_pki_locality }}"
      province: "{{ vault_pki_province }}"
      country: "{{ vault_pki_country }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
  register: vault_pki_int_csr
  when: "'pki_int/' not in vault_mounts.json"

- name: Pki Engine | Sign Intermediate CSR with Root CA
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/pki/root/sign-intermediate"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      csr: "{{ vault_pki_int_csr.json.data.csr }}"
      format: pem_bundle
      ttl: "{{ vault_pki_intermediate_ttl }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
  register: vault_pki_int_signed
  when: "'pki_int/' not in vault_mounts.json"

- name: Pki Engine | Set signed Intermediate certificate
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/pki_int/intermediate/set-signed"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      certificate: "{{ vault_pki_int_signed.json.data.certificate }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204
  when: "'pki_int/' not in vault_mounts.json"

# Put the Intermediate CA on disk the moment it exists, BEFORE Vault Agent
# can issue a server certificate from it and reload Vault. The API trust
# bundle then validates the Agent-issued chain no matter when the Agent
# swaps it in (partial-chain verification; see _api_trust.yml).
# tls_production.yml later rewrites the same file from pki_int/ca/pem.
- name: Pki Engine | Save Intermediate CA certificate early (API trust)
  ansible.builtin.copy:
    content: "{{ vault_pki_int_signed.json.data.certificate }}\n"
    dest: "{{ vault_cert_dir }}/intermediate.crt"
    owner: "{{ vault_user }}"
    group: "{{ vault_group }}"
    mode: "0444"
  when:
    - vault_pki_int_signed is not skipped
    - vault_pki_int_signed.json is defined

- name: Pki Engine | Refresh Vault API TLS trust bundle with the Intermediate CA
  ansible.builtin.include_tasks: _api_trust.yml

- name: Pki Engine | Create PKI role for Vault server certificates
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/pki_int/roles/vault-server"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    # CN is a descriptive identifier ("HashiCorp Vault"), not a hostname.
    # allow_any_name + enforce_hostnames=false let Vault accept it.
    # Actual hostname validation happens via SANs in the cert request
    # (alt_names: localhost, vault.internal, ...), not the CN field --
    # modern TLS (RFC 6125) uses SANs exclusively for hostname matching.
    body:
      allowed_domains:
        - localhost
        - "{{ vault_local_hostname }}"
        - "{{ ansible_hostname }}"
        - "{{ ansible_facts.fqdn }}"
      allow_any_name: true
      enforce_hostnames: false
      allow_subdomains: true
      allow_bare_domains: true
      allow_localhost: true
      key_type: "{{ vault_pki_key_type }}"
      key_bits: "{{ vault_pki_key_bits }}"
      organization: "{{ vault_pki_organization }}"
      ou: "{{ vault_pki_vault_server_ou }}"
      locality: "{{ vault_pki_locality }}"
      province: "{{ vault_pki_province }}"
      country: "{{ vault_pki_country }}"
      max_ttl: "{{ vault_pki_leaf_max_ttl }}"
      ttl: "{{ vault_pki_leaf_ttl }}"
      require_cn: false
      server_flag: true
      client_flag: false
      generate_lease: true
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204

- name: Pki Engine | Create PKI role for Nginx gateway certificates
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/pki_int/roles/nginx-gateway"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    # CN is "Nginx Gateway" (descriptive, not a hostname). Same rationale
    # as vault-server role above: allow_any_name + enforce_hostnames=false.
    body:
      allowed_domains:
        - "{{ vault_local_hostname }}"
      allow_any_name: true
      enforce_hostnames: false
      allow_subdomains: true
      allow_bare_domains: true
      allow_localhost: true
      key_type: "{{ vault_pki_key_type }}"
      key_bits: "{{ vault_pki_key_bits }}"
      organization: "{{ vault_pki_organization }}"
      ou: "{{ vault_pki_nginx_ou }}"
      locality: "{{ vault_pki_locality }}"
      province: "{{ vault_pki_province }}"
      country: "{{ vault_pki_country }}"
      max_ttl: "{{ vault_pki_leaf_max_ttl }}"
      ttl: "{{ vault_pki_leaf_ttl }}"
      require_cn: false
      server_flag: true
      client_flag: false
      generate_lease: true
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204

- name: Pki Engine | Create PKI role for Nginx proxy client certificates
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/pki_int/roles/nginx-proxy-client"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      allowed_domains:
        - "{{ vault_local_hostname }}"
        - "{{ vault_pki_nginx_proxy_client_cn }}"
      allow_any_name: false
      enforce_hostnames: false
      allow_subdomains: false
      allow_bare_domains: true
      allow_localhost: false
      key_type: "{{ vault_pki_key_type }}"
      key_bits: "{{ vault_pki_key_bits }}"
      organization: "{{ vault_pki_organization }}"
      ou: "{{ vault_pki_nginx_proxy_client_ou }}"
      locality: "{{ vault_pki_locality }}"
      province: "{{ vault_pki_province }}"
      country: "{{ vault_pki_country }}"
      key_usage:
        - DigitalSignature
      ext_key_usage:
        - ClientAuth
      server_flag: false
      client_flag: true
      ttl: "{{ vault_pki_leaf_ttl }}"
      max_ttl: "{{ vault_pki_leaf_max_ttl }}"
      require_cn: true
      generate_lease: true
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204

# Bastion -> SSH gateway mutual TLS (KNOWN_ISSUES P26). The gateway accepts
# only certificates carrying this OU (nginx map $ssh_gw_client_ok). The cert
# is stored (no_store: false) so it can be revoked by serial and lands on
# the CRL the gateway checks.
- name: Pki Engine | Create PKI role for bastion gateway client certificates
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/pki_int/roles/bastion-gateway-client"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      allowed_domains:
        - "{{ vault_pki_bastion_cn }}"
      allow_any_name: false
      enforce_hostnames: false
      allow_subdomains: false
      allow_bare_domains: true
      allow_localhost: false
      allow_ip_sans: false
      key_type: "{{ vault_pki_key_type }}"
      key_bits: "{{ vault_pki_key_bits }}"
      organization: "{{ vault_pki_organization }}"
      ou: "{{ vault_pki_bastion_ou }}"
      locality: "{{ vault_pki_locality }}"
      province: "{{ vault_pki_province }}"
      country: "{{ vault_pki_country }}"
      key_usage:
        - DigitalSignature
      ext_key_usage:
        - ClientAuth
      server_flag: false
      client_flag: true
      ttl: "{{ vault_pki_bastion_ttl }}"
      max_ttl: "{{ vault_pki_bastion_ttl }}"
      require_cn: true
      generate_lease: false
      no_store: false
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204

- name: Pki Engine | Create PKI role for client auth certificates
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/pki_int/roles/client-auth"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      allow_any_name: true
      enforce_hostnames: false
      key_type: "{{ vault_pki_key_type }}"
      key_bits: "{{ vault_pki_key_bits }}"
      organization: "{{ vault_pki_organization }}"
      ou: "{{ vault_pki_client_auth_ou }}"
      locality: "{{ vault_pki_locality }}"
      province: "{{ vault_pki_province }}"
      country: "{{ vault_pki_country }}"
      key_usage:
        - DigitalSignature
      ext_key_usage:
        - ClientAuth
      server_flag: false
      client_flag: true
      ttl: "72h"
      max_ttl: "168h"
      require_cn: true
      # Disable lease tracking for client-auth certs. Without this,
      # vault.service restarts orphan Vault Agent's auth token, which
      # cascades to revoking ALL leases under that token -- including
      # the PKI cert lease. The cert then appears on the CRL as
      # "revoked", and nginx's ssl_crl check returns 400 Bad Request
      # even though the cert's X.509 validity hasn't expired.
      # Confirmed via runtime testing: openssl verify -crl_check
      # showed "error 23 at 0 depth lookup: certificate revoked" for
      # a cert that was still within its 72h TTL.
      generate_lease: false
      no_store: true
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204

# ------------------------------------------------------------------
# KV v2 secrets engine
# ------------------------------------------------------------------
- name: Pki Engine | Enable KV v2 secrets engine
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/mounts/secret"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204
  when: "'secret/' not in vault_mounts.json"

# ------------------------------------------------------------------
# AppRole auth for Vault Agent (least-privilege cert rotation)
# ------------------------------------------------------------------
- name: Pki Engine | Check if AppRole auth is already enabled
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/auth"
    method: GET
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
  register: vault_auth_methods

- name: Pki Engine | Create vault-agent-tls policy (server cert rotation)
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/policies/acl/vault-agent-tls"
    method: PUT
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      policy: |
        path "pki_int/issue/vault-server" {
          capabilities = ["create", "update"]
        }
        path "pki_int/issue/nginx-gateway" {
          capabilities = ["create", "update"]
        }
        path "pki_int/issue/nginx-proxy-client" {
          capabilities = ["create", "update"]
        }
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204

- name: Pki Engine | Create vault-agent-tls-publish policy (KV copies of renewed certs)
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/policies/acl/vault-agent-tls-publish"
    method: PUT
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      # Only the two public leaf copies (KNOWN_ISSUES #57); read is needed to
      # skip unchanged writes. No access to tls/ca_bundle or anything else.
      policy: |
        path "secret/data/tls/vault" { capabilities = ["create", "update", "read"] }
        path "secret/data/tls/nginx" { capabilities = ["create", "update", "read"] }
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204

- name: Pki Engine | Create vault-agent-auth policy (identity-bearing certs)
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/policies/acl/vault-agent-auth"
    method: PUT
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      policy: |
        path "pki_int/issue/client-auth" {
          capabilities = ["create", "update"]
        }
        path "ssh-ca/sign/breakglass" {
          capabilities = ["create", "update"]
        }
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204

- name: Pki Engine | Configure AppRole auth
  when: "'approle/' not in vault_auth_methods.json"
  block:
    - name: Pki Engine | Enable AppRole auth method
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/auth/approle"
        method: POST
        headers:
          X-Vault-Token: "{{ _vault_token }}"
        body_format: json
        body:
          type: approle
        ca_path: "{{ _vault_ca_path }}"
        status_code:
          - 200
          - 204

    - name: Pki Engine | Create AppRole role for Vault Agent
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/approle/role/vault-agent"
        method: POST
        headers:
          X-Vault-Token: "{{ _vault_token }}"
        body_format: json
        body:
          token_policies:
            - vault-agent-tls
            - vault-agent-auth
            - vault-agent-tls-publish
          token_ttl: "1h"
          token_max_ttl: "4h"
          secret_id_ttl: "{{ vault_approle_secret_id_ttl }}"
          secret_id_bound_cidrs:
            - "127.0.0.1/32"
          token_bound_cidrs:
            - "127.0.0.1/32"
        ca_path: "{{ _vault_ca_path }}"
        status_code:
          - 200
          - 204

    - name: Pki Engine | Get AppRole role_id
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/approle/role/vault-agent/role-id"
        method: GET
        headers:
          X-Vault-Token: "{{ _vault_token }}"
        ca_path: "{{ _vault_ca_path }}"
        status_code:
          - 200
      register: vault_approle_role_id_resp

    - name: Pki Engine | Save AppRole role_id
      ansible.builtin.copy:
        content: "{{ vault_approle_role_id_resp.json.data.role_id }}"
        dest: "{{ vault_config_dir }}/agent-role-id"
        owner: "{{ vault_user }}"
        group: "{{ vault_group }}"
        mode: "0400"
      no_log: true

    - name: Pki Engine | Generate AppRole secret_id
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/approle/role/vault-agent/secret-id"
        method: POST
        headers:
          X-Vault-Token: "{{ _vault_token }}"
        ca_path: "{{ _vault_ca_path }}"
        status_code:
          - 200
      register: vault_approle_secret_id_resp
      no_log: true

    - name: Pki Engine | Age-encrypt AppRole secret_id
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          printf '%s' '{{ vault_approle_secret_id_resp.json.data.secret_id }}' | \
            age -e -R "{{ vault_age_recipients_file }}" \
            -o /root/vault-approle-secret.age
      changed_when: true
      no_log: true

    - name: Pki Engine | Set permissions on AppRole secret
      ansible.builtin.file:
        path: /root/vault-approle-secret.age
        owner: root
        group: root
        mode: "0400"

# ------------------------------------------------------------------
# AppRole secret_id lifecycle (backlog "AppRole secret_id Rotation")
# ------------------------------------------------------------------
# The secret_id now has a bounded TTL and is bound to loopback. It is
# rotated when less than vault_approle_secret_id_rotate_before remains,
# when it never expires (legacy secret_id_ttl=0), or on demand
# (make vault-rotate-secret-id). Rotation restarts vault-agent because the
# agent keeps the secret_id it read at start-up in memory.
# The approle mount's max lease TTL (Vault default 768h = 32 days) silently
# caps secret_id_ttl. Raise it to the intended secret_id lifetime so a
# 90-day secret_id is not clamped to 32 days (which would trigger rotation
# every couple of days). Confirmed on testfedora 2026-11-25.
- name: Pki Engine | Tune AppRole mount max TTL to the secret_id lifetime
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/auth/approle/tune"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      max_lease_ttl: "{{ vault_approle_secret_id_ttl }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204
  changed_when: false

- name: Pki Engine | Reconcile AppRole role settings (bounded secret_id TTL, loopback-bound)
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/approle/role/vault-agent"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      token_policies:
        - vault-agent-tls
        - vault-agent-auth
        - vault-agent-tls-publish
      token_ttl: "1h"
      token_max_ttl: "4h"
      secret_id_ttl: "{{ vault_approle_secret_id_ttl }}"
      secret_id_bound_cidrs:
        - "127.0.0.1/32"
      token_bound_cidrs:
        - "127.0.0.1/32"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204
  changed_when: false

- name: Pki Engine | List AppRole secret_id accessors
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/approle/role/vault-agent/secret-id"
    method: LIST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 404
  register: __vault_approle_accessors
  no_log: true

- name: Pki Engine | Look up current secret_id expiry
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/approle/role/vault-agent/secret-id-accessor/lookup"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      secret_id_accessor: "{{ item }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
  loop: "{{ __vault_approle_accessors.json.data['keys'] | default([]) }}"
  register: __vault_approle_lookups
  no_log: true

# Seconds until the LATEST-expiring secret_id expires. A non-expiring
# legacy secret_id reports expiration_time 0001-01-01 (large negative
# epoch), so it is rotated once to a bounded TTL. No accessors -> -1.
- name: Pki Engine | Compute remaining AppRole secret_id lifetime
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      now=$(date +%s)
      best=-1
      for t in {{ __vault_approle_lookups.results | default([])
                  | map(attribute='json.data.expiration_time')
                  | map('quote') | join(' ') }}; do
        e=$(date -d "$t" +%s 2>/dev/null || echo -1)
        if [ "$e" -gt "$best" ]; then best=$e; fi
      done
      echo $(( best - now ))
  register: __vault_approle_remaining
  changed_when: false

- name: Pki Engine | Decide whether to rotate the AppRole secret_id
  ansible.builtin.set_fact:
    __vault_approle_rotate: >-
      {{ (vault_approle_force_rotate | bool)
         or (__vault_approle_remaining.stdout | int < vault_approle_secret_id_rotate_before_seconds | int) }}

- name: Pki Engine | Rotate AppRole secret_id
  when: __vault_approle_rotate | bool
  block:
    - name: Pki Engine | Generate replacement AppRole secret_id
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/approle/role/vault-agent/secret-id"
        method: POST
        headers:
          X-Vault-Token: "{{ _vault_token }}"
        ca_path: "{{ _vault_ca_path }}"
        status_code:
          - 200
      register: __vault_approle_new_secret
      no_log: true

    - name: Pki Engine | Age-encrypt replacement secret_id (atomic replace)
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          umask 077
          printf '%s' '{{ __vault_approle_new_secret.json.data.secret_id }}' | \
            age -e -R "{{ vault_age_recipients_file }}" \
            -o /root/vault-approle-secret.age.new
          chmod 0400 /root/vault-approle-secret.age.new
          mv -f /root/vault-approle-secret.age.new /root/vault-approle-secret.age
      changed_when: true
      no_log: true
      notify: Restart vault-agent

    - name: Pki Engine | Destroy superseded secret_id accessors
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/approle/role/vault-agent/secret-id-accessor/destroy"
        method: POST
        headers:
          X-Vault-Token: "{{ _vault_token }}"
        body_format: json
        body:
          secret_id_accessor: "{{ item }}"
        ca_path: "{{ _vault_ca_path }}"
        status_code:
          - 200
          - 204
      loop: >-
        {{ __vault_approle_accessors.json.data['keys'] | default([])
           | reject('equalto', __vault_approle_new_secret.json.data.secret_id_accessor) | list }}
      changed_when: true
      no_log: true

# Record the active secret_id expiry for the on-host check
# (vault-approle-expiry-check, KNOWN_ISSUES #51). Rotation only happens
# on Ansible runs; the daily timer warns before expiry without needing a
# Vault token. Vault's absolute expiration_time is stable between runs,
# so this file only changes when the secret_id does.
- name: Pki Engine | List AppRole secret_id accessors (post-rotation)
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/approle/role/vault-agent/secret-id"
    method: LIST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 404
  register: __vault_approle_accessors_now
  no_log: true

- name: Pki Engine | Look up active secret_id expiry (post-rotation)
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/approle/role/vault-agent/secret-id-accessor/lookup"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      secret_id_accessor: "{{ item }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
  loop: "{{ __vault_approle_accessors_now.json.data['keys'] | default([]) }}"
  register: __vault_approle_lookups_now
  no_log: true

- name: Pki Engine | Record active secret_id expiry for the on-host check
  ansible.builtin.copy:
    dest: "{{ vault_approle_expiry_file }}"
    content: "{{ __vault_approle_lookups_now.results | map(attribute='json.data.expiration_time') | max }}\n"
    owner: root
    group: root
    mode: "0644"
  when: __vault_approle_lookups_now.results | default([]) | length > 0

# ------------------------------------------------------------------
# GRUB password hash (only generate if not already stored)
# ------------------------------------------------------------------
- name: Pki Engine | Check if GRUB hash already exists in Vault
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/{{ vault_grub_kv_path }}"
    method: GET
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 404
  register: vault_grub_kv_check

- name: Pki Engine | Generate and store GRUB hash
  when: vault_grub_kv_check.status == 404
  block:
    - name: Pki Engine | Generate GRUB password
      ansible.builtin.set_fact:
        vault_grub_password: "{{ lookup('ansible.builtin.password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Pki Engine | Generate GRUB2 PBKDF2 password hash
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          printf '%s\n' '{{ vault_grub_password }}' '{{ vault_grub_password }}' | \
            grub2-mkpasswd-pbkdf2 --iteration-count=100000
      register: vault_grub_hash_output
      changed_when: true
      no_log: true

    - name: Pki Engine | Parse GRUB hash
      ansible.builtin.set_fact:
        vault_grub_password_hash: >-
          {{ vault_grub_hash_output.stdout | regex_search('grub\.pbkdf2\.sha512\..*') }}
      no_log: true

    - name: Pki Engine | Store GRUB password hash in Vault KV
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/{{ vault_grub_kv_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ _vault_token }}"
        body_format: json
        body:
          data:
            password_hash: "{{ vault_grub_password_hash }}"
        ca_path: "{{ _vault_ca_path }}"
        status_code:
          - 200
          - 204
      no_log: true

# ------------------------------------------------------------------
# Admin policies and token
# ------------------------------------------------------------------
- name: Pki Engine | Create vault-admin-full policy
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/policies/acl/vault-admin-full"
    method: PUT
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      # Least-privilege daily-ops policy. Deliberately EXCLUDES:
      #   auth/*         -- would allow creating/deleting any auth method
      #   sys/policies/* -- would allow rewriting this policy to grant root
      # Both are privilege-escalation vectors and are reserved for the
      # break-glass root token (age-encrypted + passphrase DR backup only).
      policy: |
        path "secret/data/*" { capabilities = ["create","read","update","delete","list"] }
        path "secret/metadata/*" { capabilities = ["read","list","delete"] }
        path "pki_int/certs" { capabilities = ["list"] }
        path "pki_int/certs/*" { capabilities = ["read","list"] }
        path "pki_int/cert/*" { capabilities = ["read"] }
        path "pki_int/issue/vault-server" { capabilities = ["create","update"] }
        path "pki_int/issue/nginx-gateway" { capabilities = ["create","update"] }
        path "ssh-otp/creds/daily" { capabilities = ["create","update"] }
        path "ssh-ca/sign/breakglass" { capabilities = ["create","update"] }
        path "auth/approle/role/vault-agent/secret-id" { capabilities = ["create","update"] }
        path "auth/token/lookup-self" { capabilities = ["read"] }
        path "auth/token/renew-self" { capabilities = ["update"] }
        path "sys/health" { capabilities = ["read"] }
        path "sys/mounts" { capabilities = ["read"] }
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204

- name: Pki Engine | Create vault-admin-readonly policy
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/sys/policies/acl/vault-admin-readonly"
    method: PUT
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      # KV v2: listing and version info live under secret/metadata/; the old
      # "list" on secret/data/* never applied, so this token got 403 listing
      # secrets. secret/data/tokens/* is DENIED: it holds the admin token,
      # and read access to it would turn this read-only token into admin
      # (KNOWN_ISSUES #56).
      policy: |
        path "secret/data/*" { capabilities = ["read"] }
        path "secret/metadata/*" { capabilities = ["read","list"] }
        path "secret/data/tokens/*" { capabilities = ["deny"] }
        path "secret/metadata/tokens/*" { capabilities = ["deny"] }
        path "pki_int/certs/*" { capabilities = ["read","list"] }
        path "sys/health" { capabilities = ["read"] }
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 204

# One periodic token per purpose, reused and renewed on every run; a
# replacement is created (and the old one revoked) only when the stored
# token is missing or invalid (KNOWN_ISSUES #53).
- name: Pki Engine | Maintain daily-use tokens (admin, read-only)
  ansible.builtin.include_tasks: _daily_token.yml
  loop: "{{ vault_daily_tokens }}"
  loop_control:
    loop_var: _vault_tok
    label: "{{ _vault_tok.name }}"

# Revoke every other admin-daily / monitoring-readonly token: the backlog
# created by earlier deploys (one new pair per run, never revoked) and any
# stray copy. Vault prefixes display names with "token-".
- name: Pki Engine | List token accessors
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/token/accessors"
    method: LIST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
  register: _vault_token_accessors
  no_log: true

- name: Pki Engine | Look up token accessors
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/token/lookup-accessor"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      accessor: "{{ item }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 200
      - 400
      - 403
  loop: >-
    {{ _vault_token_accessors.json.data['keys'] | default([])
       | reject('in', _vault_daily_token_accessors | default([])) | list }}
  register: _vault_token_lookups
  no_log: true

- name: Pki Engine | Revoke superseded daily-use tokens
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/token/revoke-accessor"
    method: POST
    headers:
      X-Vault-Token: "{{ _vault_token }}"
    body_format: json
    body:
      accessor: "{{ item }}"
    ca_path: "{{ _vault_ca_path }}"
    status_code:
      - 204
      - 400
  loop: >-
    {{ _vault_token_lookups.results | default([])
       | selectattr('status', 'equalto', 200)
       | selectattr('json.data.display_name', 'in',
                    vault_daily_tokens | map(attribute='display_name') | map('regex_replace', '^', 'token-') | list)
       | map(attribute='item') | list }}
  changed_when: true
  no_log: true
