---
# roles/vault/tasks/browser_trust.yml
# Add Vault Root CA to system and browser trust stores

- name: Browser Trust | Add Root CA to system trust store
  ansible.builtin.copy:
    src: "{{ vault_cert_dir }}/root.crt"
    dest: /etc/pki/ca-trust/source/anchors/vault-root-ca.crt
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  notify:
    - Update ca trust
    - Import Root CA into Chrome/Chromium NSS database

# Both handlers above need to apply right now, not deferred to end of
# play, since later tasks expect the system/NSS trust stores to already
# include this CA. Previously these ran as unconditional regular tasks
# (changed_when: true, no gating) and reported "changed" on every single
# deploy even when the anchor file hadn't changed -- confirmed via
# runtime testing. Routing through notify + flush gives the same
# "run immediately" behavior while staying correctly idempotent (only
# fires when the copy task above actually changed the anchor file).
- name: Browser Trust | Apply CA trust store updates immediately
  ansible.builtin.meta: flush_handlers

- name: Browser Trust | Create Firefox policies directory
  ansible.builtin.file:
    path: /etc/firefox/policies
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Browser Trust | Deploy Firefox enterprise policy (CA trust + DoH disable + extensions + bookmarks)
  ansible.builtin.copy:
    dest: /etc/firefox/policies/policies.json
    content: |
      {
        "policies": {
          "Certificates": {
            "ImportEnterpriseRoots": true
          },
          "SecurityDevices": {
            "Add": {}
          },
          "Preferences": {
            "security.default_personal_cert": {
              "Value": "Select Automatically",
              "Status": "locked"
            }
          },
          "DNSOverHTTPS": {
            "Enabled": false,
            "Locked": true
          },
          "DisplayBookmarksToolbar": "always",
          "ManagedBookmarks": [
            { "toplevel_name": "Managed" },
            { "name": "Vault", "url": "https://vault.local/ui/vault/auth?with=cert" },
            { "name": "Vault Status", "url": "https://status.vault.local" }
          ],
          "ExtensionSettings": {
            "uBlock0@raymondhill.net": {
              "installation_mode": "force_installed",
              "install_url": "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi",
              "private_browsing": true
            },
            "addon@blum.coffee": {
              "installation_mode": "force_installed",
              "install_url": "https://addons.mozilla.org/firefox/downloads/latest/vaultpass/latest.xpi",
              "private_browsing": true,
              "default_area": "navbar"
            }
          }
        }
      }
    owner: root
    group: root
    mode: "0644"
