---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Compile and install Vault SELinux policy
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      cd {{ vault_selinux_dir }}
      rm -f vault.pp logrotate-vault.pp tmp/*.mod tmp/*.mod.fc 2>/dev/null || true
      # Both modules: logrotate-vault was copied but never built before,
      # so Vault audit-log rotation always failed (KNOWN_ISSUES #41).
      make -f /usr/share/selinux/devel/Makefile vault.pp logrotate-vault.pp
      semodule -i vault.pp logrotate-vault.pp
      restorecon -RF /etc/vault.d/ /etc/nginx/certs/ 2>/dev/null || true
  changed_when: true
  notify: Restart vault

# Guarded: install.yml flushes handlers (SELinux module) BEFORE the
# project vault.hcl is templated. With the HashiCorp RPM, the package
# ships its own /etc/vault.d/vault.hcl (file storage, 0.0.0.0:8200,
# /opt/vault/tls cert), so an unguarded restart here STARTED Vault with
# the package config on a fresh host. Init's "state: started" was then
# a no-op and "vault operator init" failed against the wrong listener/
# cert (confirmed on a reinstalled VM, 2026-11-24). Only restart once
# _deploy_vault_hcl.yml has run in this play; init.yml flushes handlers
# right before starting Vault so a pending restart is not lost.
- name: Restart vault
  ansible.builtin.systemd:
    name: vault
    state: restarted
  when: __vault_hcl_deploy is defined

- name: Restart vault-agent
  ansible.builtin.systemd:
    name: vault-agent
    state: restarted

- name: Restart polkit
  ansible.builtin.systemd_service:
    name: polkit.service
    state: restarted

- name: Update ca trust
  ansible.builtin.command:
    cmd: update-ca-trust
  changed_when: true

- name: Import Root CA into Chrome/Chromium NSS database
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      mkdir -p {{ common_admin_home }}/.pki/nssdb
      certutil -d sql:{{ common_admin_home }}/.pki/nssdb \
        -A -t 'CT,c,c' -n 'Vault Root CA' \
        -i /etc/pki/ca-trust/source/anchors/vault-root-ca.crt
  become: true
  become_user: "{{ common_admin_user }}"
  changed_when: true
