---
extends: default

rules:
  line-length:
    max: 200
    level: warning
  truthy:
    allowed-values:
      - "true"
      - "false"
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true

ignore:
  - .venv/
  - .github/
  - collections/
  - docs/
  - inventory/group_vars/all/vault.yml
  - roles/vault/files/selinux/
  - roles/linux-system-roles*/
  - roles/willshersystems*/
