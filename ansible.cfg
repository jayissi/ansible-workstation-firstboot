[defaults]
inventory = inventory/hosts.yml
vault_password_file = .vault_pass.txt
roles_path = roles:~/.ansible/roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
# auto_silent keeps the same auto-discovery behavior as the default "auto",
# just without the "could change on future interpreter install" warning --
# confirmed via the Ansible docs this is a no-op behavior-wise, not a pin.
interpreter_python = auto_silent
collections_path = collections:~/.ansible/collections
# Use home dir for remote tmp. After SELinux hardening, Phase 0 in site.yml
# sets become_flags with sysadm_r for playbook runs. Ad-hoc commands may
# need: ansible workstation -e ansible_become_flags="-H -S -n -r sysadm_r -t sysadm_t"
remote_tmp = ~/.ansible/tmp

[callback_defaults]
result_format = yaml

[privilege_escalation]
become = True
become_method = sudo
# become_flags set per-play in site.yml to handle both fresh (unconfined_u)
# and hardened (staff_u -> sysadm_r) systems. See site.yml pre_tasks.

[ssh_connection]
pipelining = True
ssh_args = -F .ssh_config -o ControlMaster=auto -o ControlPersist=60s
